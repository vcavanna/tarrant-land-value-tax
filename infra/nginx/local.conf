# Optional system nginx snippet for same-origin local dev.
# Prefer infra/scripts/dev-proxy.mjs (no root) unless you want nginx on :80.
#
# Symlink / include from a server block, e.g.:
#   include /path/to/tad-analysis/infra/nginx/local.conf;
#
# Expected upstreams (see root README ports table):
#   Laravel  127.0.0.1:8000
#   Martin   127.0.0.1:3000

upstream tad_laravel {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream tad_martin {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 20m;

    location /tiles/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip /tiles prefix so Martin sees /{source}/... or /catalog
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://tad_martin;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://tad_laravel;
    }
}
