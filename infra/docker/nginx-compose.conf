# nginx inside docker-compose: same-origin on container port 80 → host :8080
# Laravel is assumed on the host (artisan serve :8000).
# On Linux, host.docker.internal may need extra_hosts; compose file can add it later.

upstream tad_laravel {
    server host.docker.internal:8000;
}

upstream tad_martin {
    server martin:3000;
}

server {
    listen 80;
    server_name _;

    location /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://tad_martin;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://tad_laravel;
    }
}
